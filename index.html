<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공기 블록스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--APP-->
<header class="topbar">
  <a class="logo" href="#home" aria-label="공기 블록스 홈">
    <span class="logo-mark" aria-hidden="true"></span>
    <span class="logo-text">공기 블록스<small>GONGGI BLOX</small></span>
  </a>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="search" type="search" placeholder="친구 이름 찾기" autocomplete="off" aria-label="친구 이름 찾기">
    <div class="search-results" id="search-results" hidden></div>
  </div>
  <div class="top-actions">
    <span class="points-chip" id="total-chip" title="반 전체 대결 수"></span>
    <button class="icon-btn" id="sound-btn" type="button" aria-label="효과음 켜기/끄기"></button>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="밝게/어둡게 바꾸기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </div>
</header>
<div class="shell">
  <nav class="sidenav" id="nav" aria-label="메뉴"></nav>
  <main id="main"></main>
</div>
<div id="layer"></div>
<!--/APP-->
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
